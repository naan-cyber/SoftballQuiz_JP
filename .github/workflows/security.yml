name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"

jobs:
  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # uv-created virtualenvs have no pip, which pip-audit's environment mode requires,
      # so audit the hashed lockfile export instead.
      - name: Export locked requirements
        run: uv export --locked --format requirements-txt --no-emit-project -o requirements-audit.txt

      - name: Audit Python dependencies
        run: uvx pip-audit==2.10.1 --vulnerability-service osv --disable-pip --require-hashes -r requirements-audit.txt
